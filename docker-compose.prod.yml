services:

  postgres:
    image: postgres:15
    container_name: kamka-postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=kamka_db
    networks:
      - kamka_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${REGISTRY}/kamka-api:${IMAGE_TAG:-latest}
    container_name: kamka-api
    restart: unless-stopped
    networks:
      - kamka_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_DATABASE=kamka_db
      - DB_USER=kamka_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
    command: ['sh', '-c', 'npm run sequelize db:migrate && node src/server.js']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY}/kamka-frontend:${IMAGE_TAG:-latest}
    container_name: kamka-frontend
    ports:
      - '3001:3000'
    restart: unless-stopped
    networks:
      - kamka_network
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kamka_network:
    driver: bridge

volumes:
  postgres_prod_data:
