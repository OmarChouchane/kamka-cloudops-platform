name: Kamka CI + GHCR

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: kamka-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── Job 1: SAST + FS security scan ─────────────────────────────────────────
  security-scan:
    name: Security — SAST + FS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube SAST
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=security/sonarqube/sonar-project.properties

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-

      - name: Trivy FS scan (backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ./app/backend
          trivy-config: security/trivy/trivy.yaml
          cache-dir: ~/.cache/trivy
          format: table
          output: trivy-fs-backend.txt

      - name: Trivy FS scan (frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ./app/frontend
          trivy-config: security/trivy/trivy.yaml
          cache-dir: ~/.cache/trivy
          format: table
          output: trivy-fs-frontend.txt

      - name: Upload FS scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-reports-${{ github.run_number }}
          path: |
            trivy-fs-backend.txt
            trivy-fs-frontend.txt
          retention-days: 30

      - name: Slack — Trivy FS report
        if: always()
        run: |
          be_high=$(grep 'Total:' trivy-fs-backend.txt 2>/dev/null | grep -oP '(?<=HIGH: )\d+' | awk '{s+=$1} END {print s+0}')
          be_crit=$(grep 'Total:' trivy-fs-backend.txt 2>/dev/null | grep -oP '(?<=CRITICAL: )\d+' | awk '{s+=$1} END {print s+0}')
          fe_high=$(grep 'Total:' trivy-fs-frontend.txt 2>/dev/null | grep -oP '(?<=HIGH: )\d+' | awk '{s+=$1} END {print s+0}')
          fe_crit=$(grep 'Total:' trivy-fs-frontend.txt 2>/dev/null | grep -oP '(?<=CRITICAL: )\d+' | awk '{s+=$1} END {print s+0}')
          total_crit=$((be_crit + fe_crit))
          total_high=$((be_high + fe_high))
          icon="✅"
          [ "$total_crit" -gt 0 ] && icon="🔴"
          [ "$total_high" -gt 0 ] && [ "$total_crit" -eq 0 ] && icon="🟡"
          short_sha="${GITHUB_SHA::8}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          artifact="trivy-fs-reports-$GITHUB_RUN_NUMBER"
          table="$(printf '%-12s  %-10s  %s' 'Service' 'CRITICAL' 'HIGH')
          $(printf '%-12s  %-10s  %s' 'Backend'  "$be_crit" "$be_high")
          $(printf '%-12s  %-10s  %s' 'Frontend' "$fe_crit" "$fe_high")"
          payload=$(jq -n \
            --arg icon "$icon" \
            --arg table "$table" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$short_sha" \
            --arg run_num "$GITHUB_RUN_NUMBER" \
            --arg run_url "$run_url" \
            --arg artifact "$artifact" \
            '{blocks:[
              {type:"header",text:{type:"plain_text",text:($icon + " Trivy Filesystem Scan Report"),emoji:true}},
              {type:"section",text:{type:"mrkdwn",text:("```\n" + $table + "\n```")}},
              {type:"context",elements:[
                {type:"mrkdwn",text:("Branch: `" + $branch + "` • Commit: `" + $commit + "` • Run #" + $run_num + " • <" + $run_url + "|View in GitHub Actions> • Artifact: `" + $artifact + "`")}
              ]}
            ]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$payload"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─── Job 2: Build → Image scan → Push ───────────────────────────────────────
  build-and-push:
    name: Build → Scan → Push
    needs: security-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-

      - name: Set build metadata
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:latest \
            ./app/backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:latest \
            ./app/frontend

      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }}
          trivy-config: security/trivy/trivy.yaml
          cache-dir: ~/.cache/trivy
          format: table
          output: trivy-image-backend.txt

      - name: Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }}
          trivy-config: security/trivy/trivy.yaml
          cache-dir: ~/.cache/trivy
          format: table
          output: trivy-image-frontend.txt

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports-${{ github.run_number }}
          path: |
            trivy-image-backend.txt
            trivy-image-frontend.txt
          retention-days: 30

      - name: Slack — Trivy image report
        if: always()
        run: |
          be_high=$(grep 'Total:' trivy-image-backend.txt 2>/dev/null | grep -oP '(?<=HIGH: )\d+' | awk '{s+=$1} END {print s+0}')
          be_crit=$(grep 'Total:' trivy-image-backend.txt 2>/dev/null | grep -oP '(?<=CRITICAL: )\d+' | awk '{s+=$1} END {print s+0}')
          fe_high=$(grep 'Total:' trivy-image-frontend.txt 2>/dev/null | grep -oP '(?<=HIGH: )\d+' | awk '{s+=$1} END {print s+0}')
          fe_crit=$(grep 'Total:' trivy-image-frontend.txt 2>/dev/null | grep -oP '(?<=CRITICAL: )\d+' | awk '{s+=$1} END {print s+0}')
          total_crit=$((be_crit + fe_crit))
          total_high=$((be_high + fe_high))
          icon="✅"
          [ "$total_crit" -gt 0 ] && icon="🔴"
          [ "$total_high" -gt 0 ] && [ "$total_crit" -eq 0 ] && icon="🟡"
          short_sha="${GITHUB_SHA::8}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          artifact="trivy-image-reports-$GITHUB_RUN_NUMBER"
          table="$(printf '%-12s  %-10s  %s' 'Service' 'CRITICAL' 'HIGH')
          $(printf '%-12s  %-10s  %s' 'Backend'  "$be_crit" "$be_high")
          $(printf '%-12s  %-10s  %s' 'Frontend' "$fe_crit" "$fe_high")"
          payload=$(jq -n \
            --arg icon "$icon" \
            --arg table "$table" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$short_sha" \
            --arg run_num "$GITHUB_RUN_NUMBER" \
            --arg run_url "$run_url" \
            --arg artifact "$artifact" \
            '{blocks:[
              {type:"header",text:{type:"plain_text",text:($icon + " Trivy Image Scan Report"),emoji:true}},
              {type:"section",text:{type:"mrkdwn",text:("```\n" + $table + "\n```")}},
              {type:"context",elements:[
                {type:"mrkdwn",text:("Branch: `" + $branch + "` • Commit: `" + $commit + "` • Run #" + $run_num + " • <" + $run_url + "|View in GitHub Actions> • Artifact: `" + $artifact + "`")}
              ]}
            ]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$payload"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:latest

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:latest

  # ─── Job 3: SSH deploy to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CR_PAT,GHCR_USERNAME
          script: |
            cd /opt/kamka

            echo "Logging in to GHCR..."
            echo "$CR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pulling latest images..."
            docker compose pull

            echo "Rolling update..."
            for service in api frontend; do
              docker compose up -d --no-deps --force-recreate $service
            done

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Running DB migrations..."
            docker exec kamka-api npm run sequelize db:migrate

            echo "Health check..."
            sleep 10
            curl -f http://localhost/healthz || exit 1

        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}

      - name: Slack notify
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Kamka Deploy* — ${{ job.status }} on `${{ github.ref_name }}` by ${{ github.actor }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
