name: Kamka CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t kamka-backend:latest ./app/backend

      - name: Build frontend image
        run: |
          docker build -t kamka-frontend:latest ./app/frontend

      - name: Validate images exist
        run: |
          docker images