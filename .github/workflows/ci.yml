name: Kamka CI + GHCR

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: kamka-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── Job 1: Source + dependency security scan ────────────────────────────────
  security-scan:
    name: Security — FS Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-

      - name: Trivy FS scan (backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ./app/backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache-dir: ~/.cache/trivy

      - name: Trivy FS scan (frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ./app/frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache-dir: ~/.cache/trivy

  # ─── Job 2: Build → Image scan → Push ───────────────────────────────────────
  build-and-push:
    name: Build → Scan → Push
    needs: security-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-

      - name: Set build metadata
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:latest \
            ./app/backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }} \
            -t ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:latest \
            ./app/frontend

      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache-dir: ~/.cache/trivy

      - name: Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache-dir: ~/.cache/trivy

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-backend:latest

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/kamka-frontend:latest

  # ─── Job 3: SSH deploy to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CR_PAT,GHCR_USERNAME
          script: |
            cd /opt/kamka

            echo "Logging in to GHCR..."
            echo "$CR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pulling latest images..."
            docker compose pull

            echo "Restarting stack..."
            docker compose up -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Running DB migrations..."
            
            docker exec kamka-api npm run sequelize db:migrate

            echo "Health check..."
            sleep 10
            curl -f http://localhost/healthz || exit 1

        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
