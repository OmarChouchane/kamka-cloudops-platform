name: Kamka CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Run backend basic check
        working-directory: app/backend
        run: npm run lint || echo "No lint configured yet"

      - name: Run frontend build check
        working-directory: app/frontend
        run: npm run build